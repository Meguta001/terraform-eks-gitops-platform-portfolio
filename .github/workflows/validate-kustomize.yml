name: Validate Kustomize

on:
  push:
    branches:
      - main
    paths:
      - "k8s/**"
      - ".github/workflows/validate-kustomize.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-kustomize:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.35.0'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3

      - name: Build Kustomize manifests
        shell: bash
        run: |
          set -euo pipefail
          kubectl version --client
          kubectl kustomize k8s/overlays/dev > "$RUNNER_TEMP/kustomize-dev.yaml"

      - name: Validate resources and ECR image digests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          import re
          import sys

          import yaml

          manifest = Path(os.environ["RUNNER_TEMP"]) / "kustomize-dev.yaml"
          resources = [doc for doc in yaml.safe_load_all(manifest.read_text()) if doc is not None]
          errors = []
          required = {"Deployment": "apps/v1", "Service": "v1", "Namespace": "v1"}
          for kind, api_version in required.items():
              matches = [doc for doc in resources if doc.get("kind") == kind]
              if not matches:
                  errors.append(f"Missing required resource: {kind}")
              for doc in matches:
                  if doc.get("apiVersion") != api_version:
                      errors.append(f"{kind}: expected apiVersion {api_version}")
                  if not doc.get("metadata", {}).get("name"):
                      errors.append(f"{kind}: metadata.name is required")

          # Private Amazon ECR URI, with a complete SHA-256 digest (no tag-only images).
          ecr_digest = re.compile(
              r"[0-9]{12}\.dkr\.ecr\.[a-z]{2}(?:-[a-z]+)+-[0-9]+"
              r"\.amazonaws\.com(?:\.cn)?/"
              r"[a-z0-9]+(?:[._/-][a-z0-9]+)*@sha256:[0-9a-f]{64}"
          )
          for doc in resources:
              if doc.get("kind") != "Deployment":
                  continue
              name = doc.get("metadata", {}).get("name", "<unnamed>")
              pod_spec = doc.get("spec", {}).get("template", {}).get("spec", {})
              containers = pod_spec.get("containers", [])
              if not containers:
                  errors.append(f"Deployment/{name}: containers are required")
              for container in containers + pod_spec.get("initContainers", []):
                  image = container.get("image", "")
                  if not isinstance(image, str) or not ecr_digest.fullmatch(image):
                      errors.append(
                          f"Deployment/{name} container/{container.get('name', '<unnamed>')}: "
                          f"expected private ECR URI pinned with @sha256:<64 hex digits>, got {image!r}"
                      )

          if errors:
              for error in errors:
                  print(f"ERROR: {error}", file=sys.stderr)
              sys.exit(1)
          print("Validated Deployment, Service, Namespace, and all Deployment container ECR digests.")
          PY
