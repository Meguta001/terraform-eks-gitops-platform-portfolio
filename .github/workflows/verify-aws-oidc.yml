
name: Verify AWS OIDC

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  verify-aws-auth:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-1
          role-session-name: GitHubActionsOIDCTest
          allowed-account-ids: ${{ secrets.AWS_ACCOUNT_ID }}

      - name: Verify AWS identity
        env:
          EXPECTED_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        shell: bash
        run: |
          actual_account="$(aws sts get-caller-identity --query Account --output text)"
          test "$actual_account" = "$EXPECTED_ACCOUNT_ID"
          echo "AWS OIDC authentication successful"
